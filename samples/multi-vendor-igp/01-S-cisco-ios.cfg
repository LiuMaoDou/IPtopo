hostname IGP-S
!
router ospf 1
 router-id 10.255.0.1
 maximum-paths 8
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 maximum-paths 8
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
 no shutdown
 ip ospf 1 area 0
 ip ospf cost 1
 ip router isis CORE
!
interface GigabitEthernet0/0/0
 ip address 10.80.1.1 255.255.255.252
 no shutdown
 ip ospf 1 area 0
 ip ospf cost 10
 ip router isis CORE
 ip ospf network point-to-point
 isis network point-to-point
 isis metric 10 level-2
!
interface GigabitEthernet0/0/1
 ip address 10.80.3.1 255.255.255.252
 no shutdown
 ip ospf 1 area 0
 ip ospf cost 10
 ip router isis CORE
 ip ospf network point-to-point
 isis network point-to-point
 isis metric 10 level-2
!
end
