configure {
 system {
  name "IGP-E"
 }
 router "Base" {
  router-id 10.255.0.5
  ecmp 8
  interface "system" {
   admin-state enable
   ipv4 {
    primary {
     address 10.255.0.5
     prefix-length 32
    }
   }
  }
  interface "to-B" {
   admin-state enable
   port 1/1/1
   ipv4 {
    primary {
     address 10.80.6.2
     prefix-length 30
    }
   }
  }
  interface "to-D" {
   admin-state enable
   port 1/1/2
   ipv4 {
    primary {
     address 10.80.7.1
     prefix-length 30
    }
   }
  }
  ospf 1 {
   admin-state enable
   router-id 10.255.0.5
   area 0.0.0.0 {
    interface "system" {
     admin-state enable
     metric 1
     passive true
    }
    interface "to-B" {
     admin-state enable
     metric 10
     interface-type point-to-point
    }
    interface "to-D" {
     admin-state enable
     metric 10
     interface-type point-to-point
    }
   }
  }
  isis 1 {
   admin-state enable
   system-id 0000.0000.0005
   area-address [49.0001]
   level-capability 2
   level 2 {
    wide-metrics-only true
   }
   interface "system" {
    admin-state enable
    passive true
    level 2 {
    }
   }
   interface "to-B" {
    admin-state enable
    interface-type point-to-point
    level 2 {
     metric 10
    }
   }
   interface "to-D" {
    admin-state enable
    interface-type point-to-point
    level 2 {
     metric 10
    }
   }
  }
 }
}
