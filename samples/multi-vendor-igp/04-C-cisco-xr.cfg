!! IOS XR Configuration
hostname IGP-C
!
interface Loopback0
 ipv4 address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 ipv4 address 10.80.4.2 255.255.255.252
!
interface GigabitEthernet0/0/0/1
 ipv4 address 10.80.5.1 255.255.255.252
!
router ospf 1
 router-id 10.255.0.4
 maximum paths 8
 area 0
  interface Loopback0
   cost 1
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   cost 10
   network point-to-point
  !
  interface GigabitEthernet0/0/0/1
   cost 10
   network point-to-point
  !
 !
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
 address-family ipv4 unicast
  metric-style wide
  maximum-paths 8
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   metric 0
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
   metric 10
  !
 !
 interface GigabitEthernet0/0/0/1
  point-to-point
  address-family ipv4 unicast
   metric 10
  !
 !
!
end
