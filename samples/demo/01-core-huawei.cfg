# Synthetic demonstration only. Huawei VRP
sysname CORE-BJ-01
ip vpn-instance BLUE
 route-distinguisher 65000:10
#
interface LoopBack0
 ip address 192.0.2.1 255.255.255.255
#
interface Eth-Trunk1
 description Core backbone to CORE-SH-02
