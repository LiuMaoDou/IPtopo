interface Vlanif100
 description Shared services segment
 ip address 10.10.100.1 255.255.255.0
 ipv6 address 2001:db8:100::1/64
#
interface Vlanif200
 ip binding vpn-instance BLUE
 ip address 172.16.10.1 255.255.255.0
