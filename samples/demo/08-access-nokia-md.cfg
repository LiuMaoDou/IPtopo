configure {
    system {
        name "ACCESS-SG-01"
    }
    router "Base" {
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.8
                    prefix-length 32
                }
            }
        }
        interface "to-branch-east" {
            description "To BRANCH-EAST-02"
            port 1/1/c1/1
            admin-state enable
            ipv4 {
                primary {
                    address 10.0.4.1
                    prefix-length 31
                }
            }
        }
        interface "user-lan" {
            ipv4 {
                primary {
                    address 10.30.10.1
                    prefix-length 24
                }
            }
            ipv6 {
                address 2001:db8:3010::1 {
                    prefix-length 64
                }
            }
        }
    }
}
