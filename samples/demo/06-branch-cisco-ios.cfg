version 17.9
hostname BRANCH-WEST-01
interface Loopback0
 ip address 192.0.2.6 255.255.255.255
!
interface GigabitEthernet0/0
 description To EDGE-WEST-01
 ip address 10.0.2.1 255.255.255.254
 ipv6 address 2001:db8:20::1/127
 no shutdown
!
interface GigabitEthernet0/1
 description To DC-FABRIC-01
 ip address 10.0.3.1 255.255.255.254
 ipv6 address 2001:db8:30::1/127
!
interface GigabitEthernet0/2.10
 encapsulation dot1Q 10
 ip address 10.20.10.1 255.255.255.0
 standby 10 ip 10.20.10.254
!
interface GigabitEthernet0/3
 description Dynamic WAN excluded from subnet inference
 ip address dhcp
!
ip route 0.0.0.0 0.0.0.0 10.0.2.0
end
