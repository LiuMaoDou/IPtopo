sysname IGP-S
#
ospf 1 router-id 10.255.0.1
 maximum load-balancing 8
 area 0.0.0.0
#
isis 1
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0001.00
 maximum load-balancing 8
#
interface LoopBack0
 ip address 10.255.0.1 255.255.255.255
 ospf enable 1 area 0.0.0.0
 isis enable 1
#
interface GigabitEthernet0/0/0
 ip address 10.80.1.1 255.255.255.252
 undo shutdown
 ospf enable 1 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 1
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/1
 ip address 10.80.3.1 255.255.255.252
 undo shutdown
 ospf enable 1 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 1
 isis circuit-type p2p
 isis cost 10
#
return
