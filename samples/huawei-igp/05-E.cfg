sysname IGP-E
#
ospf 5 router-id 10.255.0.5
 maximum load-balancing 8
 area 0.0.0.0
#
isis 5
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0005.00
 maximum load-balancing 8
#
interface LoopBack0
 ip address 10.255.0.5 255.255.255.255
 ospf enable 5 area 0.0.0.0
 isis enable 5
#
interface GigabitEthernet0/0/0
 ip address 10.80.6.2 255.255.255.252
 undo shutdown
 ospf enable 5 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 5
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/1
 ip address 10.80.7.1 255.255.255.252
 undo shutdown
 ospf enable 5 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 5
 isis circuit-type p2p
 isis cost 10
#
return
