sysname IGP-B
#
ospf 3 router-id 10.255.0.3
 maximum load-balancing 8
 area 0.0.0.0
#
isis 3
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0003.00
 maximum load-balancing 8
#
interface LoopBack0
 ip address 10.255.0.3 255.255.255.255
 ospf enable 3 area 0.0.0.0
 isis enable 3
#
interface GigabitEthernet0/0/0
 ip address 10.80.3.2 255.255.255.252
 undo shutdown
 ospf enable 3 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 3
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/1
 ip address 10.80.4.1 255.255.255.252
 undo shutdown
 ospf enable 3 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 3
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/2
 ip address 10.80.6.1 255.255.255.252
 undo shutdown
 ospf enable 3 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 3
 isis circuit-type p2p
 isis cost 10
#
return
