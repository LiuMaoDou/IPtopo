sysname IGP-A
#
ospf 2 router-id 10.255.0.2
 maximum load-balancing 8
 area 0.0.0.0
#
isis 2
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0002.00
 maximum load-balancing 8
#
interface LoopBack0
 ip address 10.255.0.2 255.255.255.255
 ospf enable 2 area 0.0.0.0
 isis enable 2
#
interface GigabitEthernet0/0/0
 ip address 10.80.1.2 255.255.255.252
 undo shutdown
 ospf enable 2 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 2
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/1
 ip address 10.80.2.1 255.255.255.252
 undo shutdown
 ospf enable 2 area 0
 ospf network-type p2p
 ospf cost 20
 isis enable 2
 isis circuit-type p2p
 isis cost 20
#
return
