sysname IGP-D
#
ospf 6 router-id 10.255.0.6
 maximum load-balancing 8
 area 0.0.0.0
#
isis 6
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0006.00
 maximum load-balancing 8
#
interface LoopBack0
 ip address 10.255.0.6 255.255.255.255
 ospf enable 6 area 0.0.0.0
 isis enable 6
#
interface GigabitEthernet0/0/0
 ip address 10.80.2.2 255.255.255.252
 undo shutdown
 ospf enable 6 area 0
 ospf network-type p2p
 ospf cost 20
 isis enable 6
 isis circuit-type p2p
 isis cost 20
#
interface GigabitEthernet0/0/1
 ip address 10.80.5.2 255.255.255.252
 undo shutdown
 ospf enable 6 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 6
 isis circuit-type p2p
 isis cost 10
#
interface GigabitEthernet0/0/2
 ip address 10.80.7.2 255.255.255.252
 undo shutdown
 ospf enable 6 area 0
 ospf network-type p2p
 ospf cost 10
 isis enable 6
 isis circuit-type p2p
 isis cost 10
#
return
