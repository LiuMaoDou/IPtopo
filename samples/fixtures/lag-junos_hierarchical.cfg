groups {
 re0 { interfaces { fxp0 { unit 0 { family inet { address 192.0.2.130/27; } } } } }
 re1 { interfaces { fxp0 { unit 0 { family inet { address 192.0.2.131/27; } } } } }
 ARP { interfaces { <ae*> { unit <*> { family inet { policer { arp limiter; } } } } } }
}
apply-groups [ re0 re1 ];
interfaces {
 apply-groups ARP;
et-0/0/0 { ether-options { 802.3ad ae0; } }
et-0/0/1 { ether-options { 802.3ad ae0; } }
ae0 { aggregated-ether-options { lacp { active; } minimum-links 1; }
 unit 930 { vlan-id 930; family inet { address 192.0.2.2/30; } family inet6 { address 2001:db8::2/126; } }
}
}
routing-instances { RED { instance-type vrf; interface ae0.930; } }
