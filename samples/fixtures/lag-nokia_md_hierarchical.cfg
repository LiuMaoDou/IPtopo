configure {
 lag "lag-1" {
  admin-state enable
  port 1/1/1 { }
  port 1/1/2 { }
  lacp {
   mode active
   admin-state enable
  }
 }
 router "Base" {
  interface "uplink" {
   port lag-1:930
   ipv4 { primary {
    address 192.0.2.6
    prefix-length 30
   } }
   ipv6 { address 2001:db8::6 { prefix-length 126 } }
  }
 }
}