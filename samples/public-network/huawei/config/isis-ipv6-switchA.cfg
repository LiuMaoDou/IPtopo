#

sysname switchA

#

vlan batch 10

#

isis 1

 is-level level-1

 network-entity 10.0000.0000.0001.00

 #

 ipv6 enable topology standard

 #

#

interface Vlanif10

 ipv6 enable

 ipv6 address FC00:0:0:11::2/64

 isis ipv6 enable 1

#

interface 10GE1/0/1

 port link-type trunk
 port trunk allow-pass vlan 10

#

return
